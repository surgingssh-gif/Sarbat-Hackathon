name: parvaaz
version: 1.0.0
config-version: 2

profile: parvaaz

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

vars:
  source_dir: parvaazdata
  minimum_public_cell_size: 10

flags:
  send_anonymous_usage_stats: false

models:
  parvaaz:
    raw:
      +materialized: table
      +schema: raw
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts
