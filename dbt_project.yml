name: parvaaz
version: 1.0.0
config-version: 2

profile: parvaaz

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

vars:
  source_dir: parvaazdata

flags:
  send_anonymous_usage_stats: false

models:
  parvaaz:
    raw:
      +materialized: table
      +schema: raw
