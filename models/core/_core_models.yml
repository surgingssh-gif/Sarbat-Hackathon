version: 2

models:
  - name: map_survey_district_to_lgd
    description: Explicit reviewed mapping from supplied survey district spellings to current LGD Punjab districts. Chandigarh is retained as a non-Punjab survey geography with no Punjab LGD district code.
    columns:
      - name: survey_district_name
        data_tests: [not_null, unique]
      - name: district_key
        description: Repeats when multiple source spellings resolve to the same conformed district.
        data_tests: [not_null]
      - name: lgd_district_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_lgd_punjab_districts')
                field: district_code
      - name: canonical_district_name
        data_tests: [not_null]
      - name: is_punjab
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_district
    description: One current LGD Punjab district plus Chandigarh, using canonical LGD names and stable keys based on official LGD codes where available.
    columns:
      - name: district_key
        data_tests: [not_null, unique]
      - name: district_name
        data_tests: [not_null, unique]
      - name: lgd_district_code
        description: Current LGD district code. Null only for non-Punjab Chandigarh.
        data_tests: [unique]
      - name: is_punjab
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_subdistrict
    description: One current Punjab LGD subdistrict, linked to its conformed district.
    columns:
      - name: subdistrict_key
        data_tests: [not_null, unique]
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key
      - name: lgd_subdistrict_code
        data_tests: [not_null, unique]
      - name: subdistrict_name
        data_tests: [not_null]

  - name: dim_village
    description: One current Punjab LGD village, linked to conformed subdistrict and district dimensions.
    columns:
      - name: village_key
        data_tests: [not_null, unique]
      - name: subdistrict_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subdistrict')
                field: subdistrict_key
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key
      - name: lgd_village_code
        data_tests: [not_null, unique]
      - name: village_name
        data_tests: [not_null]
      - name: village_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Both, Rural, Unmapped, Urban]
      - name: village_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Inhabitant, Un-Inhabitant]

  - name: dim_development_block
    description: One current Punjab LGD development block represented in the village-to-block mapping source.
    columns:
      - name: development_block_key
        data_tests: [not_null, unique]
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key
      - name: lgd_development_block_code
        data_tests: [not_null, unique]
      - name: development_block_name
        data_tests: [not_null]

  - name: bridge_village_development_block
    description: One published LGD village-to-development-block/local-body mapping row. Multiple rows per village are expected and preserved.
    columns:
      - name: village_development_block_bridge_key
        data_tests: [not_null, unique]
      - name: village_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_village')
                field: village_key
      - name: development_block_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_development_block')
                field: development_block_key
      - name: source_row_number
        data_tests: [not_null, unique]

  - name: dim_school
    description: One row per supplied UDISE candidate. School names and district assignments come only from the secondary survey.
    columns:
      - name: school_key
        data_tests: [not_null, unique]
      - name: school_code
        data_tests: [not_null, unique]
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key

  - name: dim_vocational_institution
    description: One row per synthetic vocational institution code. This dimension cannot be joined to UDISE+.
    columns:
      - name: vocational_institution_key
        data_tests: [not_null, unique]
      - name: institution_code
        data_tests: [not_null, unique]
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key

  - name: fct_secondary_student_response
    description: One row per secondary-school student response. Internal and sensitive; marts must aggregate this model.
    columns:
      - name: student_response_id
        data_tests: [not_null, unique]
      - name: school_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_school')
                field: school_key
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key

  - name: fct_vocational_student_response
    description: One row per vocational student flood-exposure response. Internal and sensitive; marts must aggregate this model.
    columns:
      - name: student_response_id
        data_tests: [not_null, unique]
      - name: vocational_institution_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vocational_institution')
                field: vocational_institution_key
      - name: district_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_key
