<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Punjab Data Hub</title>
  <meta name="description" content="An open atlas of what Punjab's government-school students told Parvaaz, by district and village.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/atlas.css">
</head>
<body>
  <a class="skip" href="#inspector">Skip to details</a>

  <header class="topbar">
    <a class="brand" href="#" data-nav="state">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="7" class="bm-bg"/>
        <path d="M16 5 L27 16 L16 27 L5 16 Z" class="bm-a"/>
        <path d="M16 10 L22 16 L16 22 L10 16 Z" class="bm-b"/>
        <circle cx="16" cy="16" r="2.2" class="bm-c"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name" data-t="brand">Punjab Data Hub</span>
        <span class="brand-by" data-t="by">with Parvaaz</span>
      </span>
    </a>

    <div class="search" id="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <ul class="search-results" id="search-results" role="listbox" hidden></ul>
    </div>

    <div class="topbar-actions">
      <button type="button" class="sim-note" id="sim-badge" hidden>
        <span class="sim-dot" aria-hidden="true"></span><span class="sim-text" data-t="synthetic">Simulated data</span>
      </button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pa" aria-pressed="false" lang="pa">ਪੰਜਾਬੀ</button>
      </div>
      <button type="button" class="btn-quiet" id="about-open"><span data-t="aboutShort">About</span></button>
    </div>
  </header>

  <main class="atlas">
    <!-- The map card: choose what you see, then explore -->
    <section class="mapcard" aria-labelledby="topic-title">
      <div class="mapcard-head">
        <div class="topic">
          <button type="button" class="topic-btn" id="topic-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="topic-menu">
            <span class="topic-eyebrow" id="topic-eyebrow"></span>
            <span class="topic-line">
              <h1 class="topic-title" id="topic-title"></h1>
              <svg class="topic-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </button>
          <p class="topic-desc" id="canvas-desc"></p>
          <div class="canvas-pick" id="canvas-pick" hidden></div>
        </div>
        <div class="modes" id="modes" role="tablist" aria-label="Map view"></div>
      </div>

      <div class="legend" id="legend"></div>

      <div class="stage" id="stage">
        <div class="map-wrap" id="map"></div>
        <div class="grid-view" id="grid-view" hidden></div>
        <div class="map-controls" id="map-controls">
          <button type="button" class="ctl" id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="ctl" id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button type="button" class="ctl" id="zoom-reset" aria-label="Show all of Punjab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="ctl" id="labels-toggle" aria-pressed="true" aria-label="Map labels"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
        </div>
        <p class="map-hint" id="map-hint"></p>
      </div>
    </section>

    <!-- The details card: where you are -->
    <aside class="inspector" id="inspector" tabindex="-1" aria-label="Details">
      <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
      <div class="panel" id="panel" aria-live="polite"></div>
      <footer class="foot" id="foot"></footer>
    </aside>
  </main>

  <!-- Topic menu -->
  <div class="menu-scrim" id="menu-scrim" hidden></div>
  <div class="topic-menu" id="topic-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
    <div class="menu-head">
      <h2 id="menu-title" data-t="chooseTopic">Choose a topic</h2>
      <button type="button" class="icon-btn" id="menu-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="menu-filter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="menu-input" type="search" autocomplete="off">
    </div>
    <div class="menu-body" id="menu-body"></div>
    <div class="menu-foot">
      <button type="button" class="link-btn" data-mode-go="grid" data-t="seeAllTopics">See every topic on small maps</button>
    </div>
  </div>

  <section class="chat" id="chat" aria-label="Ask Parvaaz">
    <div class="chat-panel" id="chat-panel" hidden>
      <div class="chat-head">
        <strong data-t="chatTitle">Ask Parvaaz</strong>
        <button type="button" class="icon-btn" id="chat-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="chat-log" id="chat-log">
        <div class="msg bot" id="chat-intro"></div>
      </div>
      <div class="chat-chips" id="chat-chips"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" type="text" autocomplete="off" aria-label="Your question">
        <button type="submit" class="btn-primary" data-t="chatSend">Ask</button>
      </form>
    </div>
    <button type="button" class="chat-toggle" id="chat-toggle" aria-expanded="false" aria-controls="chat-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H9l-5 4z"/></svg>
      <span data-t="chatTitle">Ask Parvaaz</span>
    </button>
  </section>

  <div class="drawer" id="about" hidden>
    <div class="drawer-scrim" data-close></div>
    <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="drawer-head">
        <h2 id="about-title" data-t="about">About the data</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="about-body"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
