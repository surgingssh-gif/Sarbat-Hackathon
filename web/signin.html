<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Punjab Data Hub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Libre+Franklin:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
  <style>
    :root { --ink:#121212; --muted:#666; --line:#e2e2e2; --accent:#326891; --gold:#f2b134; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #fbfaf7; color: var(--ink); font: 15px/1.5 "Libre Franklin", "Noto Sans Gurmukhi", Arial, sans-serif; }
    .wrap { width: min(420px, 100%); }
    .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; text-decoration: none; color: var(--ink); }
    .brand svg { width: 34px; height: 34px; }
    .brand b { font: 700 22px/1 "Source Serif 4", Georgia, serif; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.05); }
    h1 { margin: 0; font: 700 26px/1.2 "Source Serif 4", Georgia, serif; }
    .sub { margin: 6px 0 22px; color: var(--muted); }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    input, select { font: inherit; border: 1px solid #cfcfcf; border-radius: 8px; padding: 10px 12px; background: #fff; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row label { min-width: 0; } select { width: 100%; min-width: 0; }
    fieldset { border: 0; padding: 0; margin: 0 0 18px; }
    legend { font-size: 13px; font-weight: 600; margin-bottom: 8px; padding: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips label { margin: 0; flex-direction: row; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips span { border: 1px solid #cfcfcf; border-radius: 999px; padding: 6px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .chips input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chips input:focus-visible + span { outline: 2px solid var(--accent); }
    button { width: 100%; border: 0; border-radius: 8px; padding: 12px; background: var(--ink); color: #fff; font: 700 15px/1 inherit; font-family: inherit; cursor: pointer; }
    button:hover { background: #333; }
    .guest { display: block; text-align: center; margin-top: 16px; color: var(--accent); font-weight: 600; font-size: 14px; }
    .note { margin: 18px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#121212"/><path d="M8 22 L14 10 L18 17 L21 13 L25 22 Z" fill="#f2b134"/><circle cx="22" cy="9" r="2.4" fill="#fff"/></svg>
      <b>Punjab Data Hub</b>
    </a>
    <form class="card" id="f" autocomplete="on">
      <h1 id="h">Welcome</h1>
      <p class="sub">Sign in to follow your district, save views and pick your language.</p>
      <label>Your name<input name="name" required maxlength="60" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
      <div class="row">
        <label>I am a…<select name="role">
          <option>Researcher</option><option>Teacher or school leader</option><option>Government official</option>
          <option>Journalist</option><option>Parvaaz team</option><option>Student</option><option>Other</option></select></label>
        <label>Home district<select name="home" id="home"></select></label>
      </div>
      <label>Language<select name="lang"><option value="en">English</option><option value="pa">ਪੰਜਾਬੀ</option></select></label>
      <fieldset><legend>Topics you follow</legend><div class="chips" id="topics"></div></fieldset>
      <button type="submit">Continue</button>
      <a class="guest" href="index.html">Explore without signing in →</a>
      <p class="note">Demo sign-in: your profile is saved in this browser only, and no password is collected. A real login (Google or email link) goes here before launch.</p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/account.js"></script>
  <script>
    (function () {
      const f = document.getElementById("f");
      const a = Atlas.Account.get() || {};
      const districts = Object.keys(Atlas.DISTRICT_PA).sort();
      document.getElementById("home").innerHTML = districts.map((d) => `<option${d === (a.home || "Ludhiana") ? " selected" : ""}>${d}</option>`).join("");
      const fol = a.follow || ["wealth", "villages", "floods"];
      document.getElementById("topics").innerHTML = Atlas.THEMES.map((t) =>
        `<label><input type="checkbox" name="follow" value="${t.id}"${fol.includes(t.id) ? " checked" : ""}><span>${t.label.en}</span></label>`).join("");
      if (a.name) { document.getElementById("h").textContent = "Your profile"; f.name.value = a.name; f.email.value = a.email || ""; f.role.value = a.role || "Researcher"; f.lang.value = a.lang || "en"; }
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        Atlas.Account.signIn({ name: f.name.value.trim(), email: f.email.value.trim(), role: f.role.value, home: f.home.value, lang: f.lang.value,
          follow: [...f.querySelectorAll("[name=follow]:checked")].map((x) => x.value) });
        try { sessionStorage.setItem("pdh-welcome", "1"); } catch (err) { /* ignore */ }
        location.href = "index.html";
      });
    })();
  </script>
</body>
</html>
